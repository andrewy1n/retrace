#cloud-config
# Retrace replay/grading worker. Target: Vultr vc2-16c-64gb, region sjc, Ubuntu 24.04 LTS x64 (os id 2284).
# Generated by build_cloud_init.py from scripts/, ../capture/ and ../replay/ -- edit those, then regenerate.
# No secrets here: export FACTORY_API_KEY (and optional VULTR_INFERENCE_API_KEY, HF_TOKEN) after SSH-ing in.
# Progress: tail -f /var/log/cloud-init-output.log ; done when /opt/retrace/READY exists.

package_update: true
package_upgrade: false
packages:
  - ca-certificates
  - curl
  - git
  - jq
  - ripgrep
  - xdg-utils
  - python3
  - python3-venv
  - python3-pip
  - build-essential
  - tmux
  - htop

users:
  - default
  - name: retrace
    gecos: Retrace worker
    shell: /bin/bash
    groups: [sudo]
    sudo: "ALL=(ALL) NOPASSWD:ALL"

write_files:
  - path: /etc/sysctl.d/90-retrace.conf
    content: |
      fs.inotify.max_user_watches = 1048576
      fs.inotify.max_user_instances = 8192
      fs.file-max = 2097152
      vm.max_map_count = 262144
  - path: /etc/security/limits.d/90-retrace.conf
    content: |
      *    soft nofile 1048576
      *    hard nofile 1048576
      root soft nofile 1048576
      root hard nofile 1048576
  - path: /etc/docker/daemon.json
    content: |
      {
        "default-ulimits": {"nofile": {"Name": "nofile", "Soft": 1048576, "Hard": 1048576}},
        "log-driver": "json-file",
        "log-opts": {"max-size": "50m", "max-file": "3"},
        "max-concurrent-downloads": 6
      }
  - path: /etc/profile.d/retrace.sh
    content: |
      export PATH="/opt/retrace/venv/bin:/opt/retrace:$PATH"
      export SWEBENCH_DATASET="SWE-bench/SWE-bench_Verified"
      # Set secrets yourself, e.g.: export FACTORY_API_KEY=fk-...   (never commit them)
  - path: /opt/retrace/prepull.sh
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      # Pre-pull SWE-bench Verified or SWE-bench Pro instance images (amd64) for a list of instance IDs.
      #
      # Usage:
      #   /opt/retrace/prepull.sh django__django-11099 sympy__sympy-20590 ...
      #   /opt/retrace/prepull.sh -f ids.txt            # one instance_id per line, '#' comments ok
      #   PREPULL_JOBS=6 /opt/retrace/prepull.sh -f ids.txt
      #   /opt/retrace/prepull.sh instance_NodeBB__NodeBB-<hash>-vnan
      #
      # Image name rule (matches swebench 5.x ImageSpec.name and the `image` column of
      # SWE-bench/SWE-bench_Verified): swebench/sweb.eval.x86_64.<id, "__" -> "_1776_", lowercased>:latest
      # Each instance image already contains its env layers, so no separate env image pull is needed.
      # An id that starts with instance_ is a SWE-bench Pro id. Its image is ghcr.io/scaleapi/swe-bench_pro-v2:<id>
      # with the case kept, as in the docker_image column. An argument with a colon is pulled as written.
      set -euo pipefail

      JOBS="${PREPULL_JOBS:-4}"
      TAG="${SWEBENCH_IMAGE_TAG:-latest}"
      LOG_DIR="${PREPULL_LOG_DIR:-/opt/retrace/logs/prepull}"

      usage() { sed -n '2,14p' "$0"; exit 1; }

      ids=()
      while [[ $# -gt 0 ]]; do
        case "$1" in
          -f|--file)
            [[ $# -ge 2 ]] || usage
            while IFS= read -r line || [[ -n "$line" ]]; do
              line="${line%%#*}"; line="${line//[[:space:]]/}"
              [[ -n "$line" ]] && ids+=("$line")
            done < "$2"
            shift 2 ;;
          -h|--help) usage ;;
          *) ids+=("$1"); shift ;;
        esac
      done
      [[ ${#ids[@]} -gt 0 ]] || usage

      image_for() {
        local id="$1"
        case "$id" in
          *:*) printf '%s\n' "$id"; return ;;
          instance_*) printf '%s\n' "ghcr.io/scaleapi/swe-bench_pro-v2:$id"; return ;;
        esac
        local key="swebench/sweb.eval.x86_64.${id//__/_1776_}:${TAG}"
        printf '%s\n' "${key,,}"
      }

      mkdir -p "$LOG_DIR"
      list="$(mktemp)"
      trap 'rm -f "$list"' EXIT
      for id in "${ids[@]}"; do image_for "$id"; done | sort -u > "$list"

      echo "Pulling $(wc -l < "$list") image(s) with $JOBS parallel jobs; logs in $LOG_DIR"
      export LOG_DIR
      # shellcheck disable=SC2016
      xargs -a "$list" -P "$JOBS" -I{} bash -c '
        img="$1"; log="$LOG_DIR/$(echo "$img" | tr "/:" "__").log"
        if docker image inspect "$img" >/dev/null 2>&1; then echo "have  $img"; exit 0; fi
        if docker pull --platform linux/amd64 "$img" >"$log" 2>&1; then echo "ok    $img"; else echo "FAIL  $img (see $log)"; exit 1; fi
      ' _ {} || { echo "Some pulls failed." >&2; exit 1; }

      docker system df
  - path: /opt/retrace/run_trial.sh
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      # Run one trial of a step0 job: Droid on one SWE-bench task inside its official image.
      # The job's dataset picks the task source: swebench_verified (default, repo at /testbed) or
      # swebench_pro (SWE-bench Pro V2: prompt from the harness's instruction.md, repo at /app or /testbed).
      #
      # Usage: /opt/retrace/run_trial.sh <job.json> <task_id> <trial>
      # Needs: FACTORY_API_KEY in the environment. Optional: DROID_TIMEOUT (seconds, default 1800),
      #        RETRACE_REPO (default /opt/retrace/repo), PRO_TASKS (see pro_task.sh).
      # Output: /opt/retrace/runs/<job_id>/<task_id>/<trial>/{prompt.md,start_commit,droid.json,droid.stderr,patch.diff,pred.json,meta.json,
      #         capture/,factory-sessions/,snapshots.bundle}
      # Writes the trace to $RETRACE_REPO/runs/traces/<session_id>.json, where session_id is <job_id>-<task_id>-<trial>,
      # and links /opt/retrace/sessions/<session_id> to the output directory.
      set -euo pipefail

      [[ $# -eq 3 ]] || { sed -n '2,9p' "$0"; exit 1; }
      JOB="$(realpath "$1")"; IID="$2"; TRIAL="$3"
      : "${FACTORY_API_KEY:?Set FACTORY_API_KEY first (export FACTORY_API_KEY=fk-...)}"

      ROOT="${RETRACE_ROOT:-/opt/retrace}"
      REPO="${RETRACE_REPO:-$ROOT/repo}"
      PY="$ROOT/venv/bin/python"
      DATASET="${SWEBENCH_DATASET:-SWE-bench/SWE-bench_Verified}"
      # shellcheck source=pro_task.sh
      source "$ROOT/pro_task.sh"

      JOB_ID="$(jq -r .job_id "$JOB")"
      SUITE="$(jq -r '.dataset // "swebench_verified"' "$JOB")"
      MODEL="$(jq -r .model "$JOB")"
      ARM="$(jq -r .arm.kind "$JOB")"
      HINT="$(jq -r '.arm.text // ""' "$JOB")"
      CANDIDATE="$(jq -r '.arm.path // ""' "$JOB")"

      OUT="$ROOT/runs/$JOB_ID/$IID/$TRIAL"
      NAME="retrace-${JOB_ID}-${IID}-${TRIAL}"
      NAME="${NAME//[^A-Za-z0-9_.-]/-}"
      NAME="${NAME,,}"
      rm -rf "$OUT"; mkdir -p "$OUT"

      if [[ "$ARM" == candidate ]]; then
        [[ -d "$REPO/$CANDIDATE/.factory" || -f "$REPO/$CANDIDATE/AGENTS.md" ]] \
          || { echo "[$IID] candidate $CANDIDATE has no .factory/ or AGENTS.md under $REPO" >&2; exit 1; }
      fi

      # 1. Prompt: the problem statement, plus the hint for a hint arm. Never tests, patch, or dataset hints.
      if [[ "$SUITE" == swebench_pro ]]; then
        WORKDIR=""
        IMAGE="$(pro_image "$IID")"
        cp "$(pro_task_dir "$IID")/instruction.md" "$OUT/prompt.md"
        [[ -z "$HINT" ]] || printf '\n<hint>\n%s\n</hint>\n' "$HINT" >> "$OUT/prompt.md"
      else
        WORKDIR=/testbed
        IMAGE="$("$PY" - "$DATASET" "$IID" "$OUT/prompt.md" "$HINT" <<'PY'
      import sys
      from datasets import load_dataset
      name, iid, out, hint = sys.argv[1:5]
      row = next(r for r in load_dataset(name, split="test") if r["instance_id"] == iid)
      text = (
          "You are working in the git repository at /testbed (Python env: "
          "`source /opt/miniconda3/bin/activate testbed`).\n"
          "Resolve the issue below by editing the source code. Do not commit.\n\n"
          "<issue>\n" + row["problem_statement"] + "\n</issue>\n"
      )
      if hint:
          text += "\n<hint>\n" + hint + "\n</hint>\n"
      open(out, "w").write(text)
      print(row["image"])
      PY
        )"
      fi
      echo "[$IID#$TRIAL] image $IMAGE"

      # shellcheck disable=SC2329  # invoked via trap
      cleanup() { docker rm -f "$NAME" >/dev/null 2>&1 || true; }
      trap cleanup EXIT

      # 2. Start the task container with the host droid binary mounted read-only.
      docker run -d --name "$NAME" --platform linux/amd64 \
        -e FACTORY_API_KEY \
        -v /usr/local/bin/droid:/usr/local/bin/droid:ro \
        -v "$OUT:/retrace" \
        -v "$ROOT/capture:/opt/retrace-capture:ro" \
        ${WORKDIR:+-w "$WORKDIR"} "$IMAGE" sleep infinity >/dev/null
      [[ -n "$WORKDIR" ]] || WORKDIR="$(pro_workdir "$NAME")"
      [[ -n "$WORKDIR" ]] || { echo "[$IID] no git repository in /app or /testbed" >&2; exit 1; }

      # 3. Record HEAD to diff against. Candidate arm: overlay .factory/ and AGENTS.md. Keep both out of the patch.
      docker exec "$NAME" bash -c "printf '/.factory/\n/AGENTS.md\n' >> $WORKDIR/.git/info/exclude"
      if [[ "$ARM" == candidate ]]; then
        [[ -d "$REPO/$CANDIDATE/.factory" ]] && docker cp "$REPO/$CANDIDATE/.factory" "$NAME:$WORKDIR/.factory"
        [[ -f "$REPO/$CANDIDATE/AGENTS.md" ]] && docker cp "$REPO/$CANDIDATE/AGENTS.md" "$NAME:$WORKDIR/AGENTS.md"
      fi
      docker exec -i "$NAME" bash -c 'mkdir -p /root/.factory && cat > /root/.factory/hooks.json' <<'JSON'
      {"PostToolUse": [{"matcher": "*", "hooks": [{"type": "command", "command": "/opt/retrace-capture/hook.sh"}]}]}
      JSON
      docker exec "$NAME" git -C "$WORKDIR" rev-parse HEAD > "$OUT/start_commit"
      DROID_VERSION="$(docker exec "$NAME" droid --version | tail -n 1)"

      # 4. Headless Droid run. The container is disposable, so skip permission prompts.
      set +e
      timeout "${DROID_TIMEOUT:-1800}" docker exec -e FACTORY_API_KEY -e RETRACE_CAPTURE_DIR=/retrace/capture "$NAME" \
        droid exec --skip-permissions-unsafe --cwd "$WORKDIR" -o json --model "$MODEL" -f /retrace/prompt.md \
        > "$OUT/droid.json" 2> "$OUT/droid.stderr"
      rc=$?
      set -e
      echo "[$IID#$TRIAL] droid exit $rc"

      # 5. Patch = everything changed since the container started, including new files.
      docker exec "$NAME" bash -c "cd $WORKDIR && git add -A && git -c core.fileMode=false diff --cached $(<"$OUT/start_commit")" > "$OUT/patch.diff"
      echo "[$IID#$TRIAL] patch $(wc -l < "$OUT/patch.diff") lines"

      "$PY" - "$IID" "$JOB_ID-$ARM" "$OUT/patch.diff" "$OUT/pred.json" <<'PY'
      import json, sys
      iid, model, patch, out = sys.argv[1:5]
      json.dump({"instance_id": iid, "model_name_or_path": model, "model_patch": open(patch).read()}, open(out, "w"))
      PY

      # 6. Trace: keep the Droid session and the snapshot commits, then join them into runs/traces/.
      docker cp "$NAME:/root/.factory/sessions" "$OUT/factory-sessions" >/dev/null 2>&1 || true
      docker exec -e WORKDIR "$NAME" bash -c 'cd "$WORKDIR" && refs=$(git for-each-ref --format="%(refname)" refs/retrace) && [ -n "$refs" ] && git bundle create /retrace/snapshots.bundle $refs ^$(git rev-parse "$(cat /retrace/start_commit)^")' >/dev/null 2>&1 || true
      mkdir -p "$ROOT/sessions" && ln -sfn "$OUT" "$ROOT/sessions/$JOB_ID-$IID-$TRIAL"
      CAPTURE="$(find "$OUT/capture" -name '*.jsonl' 2>/dev/null | head -n 1)"
      SID="$(jq -r '.session_id // empty' "$OUT/droid.json" 2>/dev/null || true)"
      [[ -n "$SID" || -z "$CAPTURE" ]] || SID="$(basename "$CAPTURE" .jsonl)"
      TRANSCRIPT=""
      [[ -z "$SID" ]] || TRANSCRIPT="$(find "$OUT/factory-sessions" -name "$SID.jsonl" 2>/dev/null | head -n 1)"
      if [[ -n "$TRANSCRIPT" && -n "$CAPTURE" ]]; then
        RETRACE_REPO="$REPO" "$PY" "$ROOT/capture/trace.py" --session-id "$JOB_ID-$IID-$TRIAL" --task-id "$IID" \
          --transcript "$TRANSCRIPT" --capture "$CAPTURE" || echo "[$IID#$TRIAL] trace failed" >&2
      else
        echo "[$IID#$TRIAL] no transcript or capture log, no trace" >&2
      fi

      # 7. Cost and metadata. A killed run prints no JSON, so its cost comes from the session's settings.json.
      COST="$(jq -r '.usage.factory_credits // empty' "$OUT/droid.json" 2>/dev/null || true)"
      if [[ -z "$COST" ]]; then
        SETTINGS="${TRANSCRIPT%.jsonl}.settings.json"
        if [[ -f "$SETTINGS" ]]; then
          COST="$(jq -r '.tokenUsage.factoryCredits // empty' "$SETTINGS" 2>/dev/null || true)"
        fi
      fi
      TIMED_OUT=false
      [[ "$rc" -ne 124 ]] || TIMED_OUT=true
      jq -n --arg v "$DROID_VERSION" --argjson cost "${COST:-0}" --argjson rc "$rc" --argjson timed_out "$TIMED_OUT" \
        --arg sid "$(jq -r '.session_id // ""' "$OUT/droid.json" 2>/dev/null || true)" \
        '{droid_version: $v, cost_credits: $cost, droid_exit: $rc, timed_out: $timed_out, droid_session_id: $sid}' > "$OUT/meta.json"
  - path: /opt/retrace/run_job.sh
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      # Run every task and rerun of a step0 job, or every tool_call_id and rerun of a checkpoint job. Trials that already have a meta.json are skipped.
      #
      # Usage: /opt/retrace/run_job.sh <job.json> [parallel=8]
      # Stops starting trials once the credits spent reach budget_credits. Running trials finish, so up to
      # <parallel> trials can overshoot. Exits 3 when trials are left undone.
      # Then grade: /opt/retrace/grade.sh <job.json>
      set -euo pipefail

      [[ $# -ge 1 ]] || { sed -n '2,7p' "$0"; exit 1; }
      JOB="$(realpath "$1")"; PARALLEL="${2:-8}"
      ROOT="${RETRACE_ROOT:-/opt/retrace}"
      PY="$ROOT/venv/bin/python"
      REPO="${RETRACE_REPO:-$ROOT/repo}"

      "$PY" "$ROOT/retrace_job.py" validate "$JOB"
      JOB_ID="$(jq -r .job_id "$JOB")"
      BUDGET="$(jq .budget_credits "$JOB")"
      RUNS="$ROOT/runs/$JOB_ID"
      mkdir -p "$RUNS"

      if [[ "$(jq -r .start "$JOB")" == checkpoint ]]; then
        RUNNER="$ROOT/replay/run_checkpoint.sh"
        TASK="$(jq -r .task_id "$REPO/runs/traces/$(jq -r .session_id "$JOB").json")"
        UNITS="$(jq -r '.tool_call_ids[]' "$JOB")"
        unit_dir() { echo "$RUNS/$TASK/$1/$2"; }
      else
        RUNNER="$ROOT/run_trial.sh"
        UNITS="$(jq -r '.task_ids[]' "$JOB")"
        unit_dir() { echo "$RUNS/$1/$2"; }
      fi

      spent() { find "$RUNS" -name meta.json -exec cat {} + | jq -s '[.[].cost_credits] | add // 0'; }
      done_trial() { [[ -f "$1/meta.json" ]] && ! jq -e .failed "$1/meta.json" >/dev/null; }
      pairs() {
        for ((t = 1; t <= $(jq .reruns "$JOB"); t++)); do
          for unit in $UNITS; do
            done_trial "$(unit_dir "$unit" "$t")" || echo "$unit $t"
          done
        done
      }

      worker() {
        if jq -en --argjson s "$(spent)" --argjson b "$BUDGET" '$s >= $b' >/dev/null; then
          echo "[$1#$2] skipped, budget reached"; return 0
        fi
        "$RUNNER" "$JOB" "$1" "$2" || echo "[$1#$2] trial failed" >&2
      }
      export -f worker spent
      export JOB ROOT RUNS BUDGET RUNNER

      pairs | xargs -r -P "$PARALLEL" -L1 bash -c 'worker "$@"' _

      left="$(pairs | wc -l)"
      echo "spent $(spent) of $BUDGET credits; $left trial(s) left"
      [[ "$left" -eq 0 ]] || exit 3
  - path: /opt/retrace/grade.sh
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      # Finish a job and write one result file per trial. A step0 job gets the dataset grader plus proxies. A checkpoint job
      # gets proxies only and is never graded. A swebench_verified job (default) goes through the official SWE-bench harness.
      # A swebench_pro job goes through the task's own verifier from the SWE-bench Pro harness (grade_pro.sh), one fresh
      # container per trial, <max_workers> at once. proxies.sh writes proxies.json in each trial directory.
      #
      # Usage: /opt/retrace/grade.sh <job.json> [max_workers=8] [trial]
      # Results: $RETRACE_REPO/runs/results/<job_id>/<task_id>-<step0 or tool_call_id>-<arm>-<trial>.json
      # The harness takes one prediction per instance. A step0 job grades each trial number as one evaluation run.
      # A checkpoint job runs proxies.sh for each (tool_call_id, trial), <max_workers> at once.
      set -euo pipefail

      [[ $# -ge 1 ]] || { sed -n '2,11p' "$0"; exit 1; }
      JOB="$(realpath "$1")"; WORKERS="${2:-8}"; ONLY="${3:-}"
      ROOT="${RETRACE_ROOT:-/opt/retrace}"
      PY="$ROOT/venv/bin/python"

      "$PY" "$ROOT/retrace_job.py" validate "$JOB"
      JOB_ID="$(jq -r .job_id "$JOB")"
      SUITE="$(jq -r '.dataset // "swebench_verified"' "$JOB")"
      REPO="${RETRACE_REPO:-$ROOT/repo}"
      RUNS="$ROOT/runs/$JOB_ID"
      failed=0

      if [[ "$(jq -r .start "$JOB")" == checkpoint ]]; then
        TASK="$(jq -r .task_id "$REPO/runs/traces/$(jq -r .session_id "$JOB").json")"
        proxies_one() {
          local art="$RUNS/$TASK/$1/$2"
          [[ -f "$art/meta.json" ]] && ! jq -e .failed "$art/meta.json" >/dev/null || return 0
          "$ROOT/proxies.sh" "$JOB" "$TASK" "$art"
        }
        export -f proxies_one
        export RUNS TASK ROOT JOB
        for ((t = 1; t <= $(jq .reruns "$JOB"); t++)); do
          [[ -z "$ONLY" || "$ONLY" == "$t" ]] || continue
          jq -r '.tool_call_ids[]' "$JOB" | xargs -r -P "$WORKERS" -I{} bash -c 'proxies_one "$@"' _ {} "$t" \
            || failed=1
          "$PY" "$ROOT/retrace_job.py" collect "$JOB" "$t" || failed=1
        done
        if [[ -n "${TIGER_DATABASE_URL:-}" ]]; then
          "$PY" "$ROOT/tiger_sink.py" results "$REPO/runs/results/$JOB_ID" || failed=1
        fi
        [[ "$failed" -eq 0 ]] || { echo "some trials could not be collected, see above" >&2; exit 1; }
        exit 0
      fi

      step0_proxies() {
        local t="$1" task
        for task in $(jq -r '.task_ids[]' "$JOB"); do
          [[ -f "$RUNS/$task/$t/meta.json" ]] && ! jq -e .failed "$RUNS/$task/$t/meta.json" >/dev/null && echo "$task"
        done | xargs -r -P "$WORKERS" -I{} "$ROOT/proxies.sh" "$JOB" {} "$RUNS/{}/$t" || failed=1
      }

      for ((t = 1; t <= $(jq .reruns "$JOB"); t++)); do
        [[ -z "$ONLY" || "$ONLY" == "$t" ]] || continue
        EVAL_DIR="$RUNS/eval-t$t"
        mkdir -p "$EVAL_DIR"
        if [[ "$SUITE" == swebench_pro ]]; then
          for task in $(jq -r '.task_ids[]' "$JOB"); do
            [[ -f "$RUNS/$task/$t/meta.json" ]] && echo "$task"
          done | xargs -r -P "$WORKERS" -I{} "$ROOT/grade_pro.sh" {} "$RUNS/{}/$t/patch.diff" "$EVAL_DIR/{}" || failed=1
          step0_proxies "$t"
          "$PY" "$ROOT/retrace_job.py" collect "$JOB" "$t" || failed=1
          if [[ -n "${TIGER_DATABASE_URL:-}" ]]; then
            "$PY" "$ROOT/tiger_sink.py" results "$REPO/runs/results/$JOB_ID" || failed=1
          fi
          continue
        fi
        PRED="$EVAL_DIR/predictions.jsonl"
        : > "$PRED"
        for task in $(jq -r '.task_ids[]' "$JOB"); do
          if [[ -f "$RUNS/$task/$t/meta.json" ]]; then cat "$RUNS/$task/$t/pred.json" >> "$PRED"; echo >> "$PRED"; fi
        done
        [[ -s "$PRED" ]] || { echo "trial $t: nothing to grade"; continue; }

        cd "$EVAL_DIR"   # swebench writes logs/run_evaluation/<eval_id>/ under cwd
        "$PY" -m swebench.harness.run_evaluation \
          --dataset_name "${SWEBENCH_DATASET:-SWE-bench/SWE-bench_Verified}" \
          --predictions_path "$PRED" \
          --max_workers "$WORKERS" \
          --run_id "t$t-$(date +%Y%m%d%H%M%S)" \
          --report_dir "$EVAL_DIR"
        step0_proxies "$t"
        "$PY" "$ROOT/retrace_job.py" collect "$JOB" "$t" || { failed=1; continue; }
        if [[ -n "${TIGER_DATABASE_URL:-}" ]]; then
          "$PY" "$ROOT/tiger_sink.py" results "$REPO/runs/results/$JOB_ID" || failed=1
        fi
      done
      [[ "$failed" -eq 0 ]] || { echo "some trials could not be collected, see above" >&2; exit 1; }
  - path: /opt/retrace/grade_pro.sh
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      # Grade one patch on one SWE-bench Pro V2 task with the task's own verifier from the official harness.
      #
      # Usage: /opt/retrace/grade_pro.sh <task_id> <patch.diff | gold | empty> <out_dir>
      # Starts a fresh container from the task image, applies the patch as the harness's patch_replay agent does,
      # mounts the task's tests/ at /tests and out_dir at /logs/verifier, and runs `bash /tests/test.sh`.
      # The verifier writes reward.txt (1 passed, 0 failed). `gold` applies the task's reference patch and `empty` applies nothing.
      # Output: <out_dir>/{apply.log,test.log,seconds,reward.txt,output.json,run-script-stdout.txt,run-script-stderr.txt}
      # Exits 1 when the verifier left no reward.txt (image, apply, or timeout trouble). Needs PRO_TASKS (see pro_task.sh).
      set -euo pipefail

      [[ $# -eq 3 ]] || { sed -n '2,9p' "$0"; exit 1; }
      IID="$1"; PATCH="$2"; OUT="$(realpath -m "$3")"
      # shellcheck source=pro_task.sh
      source "$(dirname "$(realpath "$0")")/pro_task.sh"

      TASK="$(pro_task_dir "$IID")"
      IMAGE="$(pro_image "$IID")"
      case "$PATCH" in
        gold) PATCH="$TASK/solution/gold_patch.diff" ;;
        empty) PATCH="" ;;
      esac

      NAME="retrace-pro-grade-${IID//[^A-Za-z0-9_.-]/-}"
      NAME="${NAME:0:100}-$$"
      mkdir -p "$OUT"
      rm -f "$OUT/reward.txt" "$OUT/output.json" "$OUT/apply.log" "$OUT/test.log" "$OUT/seconds"

      # shellcheck disable=SC2329  # invoked via trap
      cleanup() { docker rm -f "$NAME" >/dev/null 2>&1 || true; }
      trap cleanup EXIT

      start=$SECONDS
      docker run -d --name "$NAME" --platform linux/amd64 \
        -v "$TASK/tests:/tests:ro" -v "$OUT:/logs/verifier" "$IMAGE" sleep infinity >/dev/null

      if [[ -s "$PATCH" ]]; then
        docker cp "$PATCH" "$NAME:/tmp/replay.patch"
        docker exec "$NAME" bash -c 'cd /app 2>/dev/null || cd /testbed
          git apply --verbose /tmp/replay.patch || git apply --3way /tmp/replay.patch || patch --fuzz=3 -p1 -i /tmp/replay.patch' \
          > "$OUT/apply.log" 2>&1 || echo "[$IID] patch did not apply, see $OUT/apply.log" >&2
      fi

      set +e
      timeout "$(pro_verifier_timeout "$IID")" docker exec "$NAME" bash /tests/test.sh > "$OUT/test.log" 2>&1
      rc=$?
      set -e
      echo $((SECONDS - start)) > "$OUT/seconds"
      [[ -f "$OUT/reward.txt" ]] || { echo "[$IID] verifier exit $rc left no reward.txt" >&2; exit 1; }
      echo "[$IID] reward $(<"$OUT/reward.txt") in $(<"$OUT/seconds") s"
