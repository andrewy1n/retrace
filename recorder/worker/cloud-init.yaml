#cloud-config
# Retrace replay/grading worker. Target: Vultr vc2-16c-64gb, region sjc, Ubuntu 24.04 LTS x64 (os id 2284).
# Generated by build_cloud_init.py from scripts/ and ../capture/ -- edit those, then regenerate.
# No secrets here: export FACTORY_API_KEY (and optional VULTR_INFERENCE_API_KEY, HF_TOKEN) after SSH-ing in.
# Progress: tail -f /var/log/cloud-init-output.log ; done when /opt/retrace/READY exists.

package_update: true
package_upgrade: false
packages:
  - ca-certificates
  - curl
  - git
  - jq
  - ripgrep
  - xdg-utils
  - python3
  - python3-venv
  - python3-pip
  - build-essential
  - tmux
  - htop

users:
  - default
  - name: retrace
    gecos: Retrace worker
    shell: /bin/bash
    groups: [sudo]
    sudo: "ALL=(ALL) NOPASSWD:ALL"

write_files:
  - path: /etc/sysctl.d/90-retrace.conf
    content: |
      fs.inotify.max_user_watches = 1048576
      fs.inotify.max_user_instances = 8192
      fs.file-max = 2097152
      vm.max_map_count = 262144
  - path: /etc/security/limits.d/90-retrace.conf
    content: |
      *    soft nofile 1048576
      *    hard nofile 1048576
      root soft nofile 1048576
      root hard nofile 1048576
  - path: /etc/docker/daemon.json
    content: |
      {
        "default-ulimits": {"nofile": {"Name": "nofile", "Soft": 1048576, "Hard": 1048576}},
        "log-driver": "json-file",
        "log-opts": {"max-size": "50m", "max-file": "3"},
        "max-concurrent-downloads": 6
      }
  - path: /etc/profile.d/retrace.sh
    content: |
      export PATH="/opt/retrace/venv/bin:/opt/retrace:$PATH"
      export SWEBENCH_DATASET="SWE-bench/SWE-bench_Verified"
      # Set secrets yourself, e.g.: export FACTORY_API_KEY=fk-...   (never commit them)
  - path: /opt/retrace/prepull.sh
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      # Pre-pull SWE-bench Verified instance images (amd64) for a list of instance IDs.
      #
      # Usage:
      #   /opt/retrace/prepull.sh django__django-11099 sympy__sympy-20590 ...
      #   /opt/retrace/prepull.sh -f ids.txt            # one instance_id per line, '#' comments ok
      #   PREPULL_JOBS=6 /opt/retrace/prepull.sh -f ids.txt
      #
      # Image name rule (matches swebench 5.x ImageSpec.name and the `image` column of
      # SWE-bench/SWE-bench_Verified): swebench/sweb.eval.x86_64.<id, "__" -> "_1776_", lowercased>:latest
      # Each instance image already contains its env layers, so no separate env image pull is needed.
      set -euo pipefail

      JOBS="${PREPULL_JOBS:-4}"
      TAG="${SWEBENCH_IMAGE_TAG:-latest}"
      LOG_DIR="${PREPULL_LOG_DIR:-/opt/retrace/logs/prepull}"

      usage() { sed -n '2,10p' "$0"; exit 1; }

      ids=()
      while [[ $# -gt 0 ]]; do
        case "$1" in
          -f|--file)
            [[ $# -ge 2 ]] || usage
            while IFS= read -r line || [[ -n "$line" ]]; do
              line="${line%%#*}"; line="${line//[[:space:]]/}"
              [[ -n "$line" ]] && ids+=("$line")
            done < "$2"
            shift 2 ;;
          -h|--help) usage ;;
          *) ids+=("$1"); shift ;;
        esac
      done
      [[ ${#ids[@]} -gt 0 ]] || usage

      image_for() {
        local id="$1"
        local key="swebench/sweb.eval.x86_64.${id//__/_1776_}:${TAG}"
        printf '%s\n' "${key,,}"
      }

      mkdir -p "$LOG_DIR"
      list="$(mktemp)"
      trap 'rm -f "$list"' EXIT
      for id in "${ids[@]}"; do image_for "$id"; done | sort -u > "$list"

      echo "Pulling $(wc -l < "$list") image(s) with $JOBS parallel jobs; logs in $LOG_DIR"
      export LOG_DIR
      # shellcheck disable=SC2016
      xargs -a "$list" -P "$JOBS" -I{} bash -c '
        img="$1"; log="$LOG_DIR/$(echo "$img" | tr "/:" "__").log"
        if docker image inspect "$img" >/dev/null 2>&1; then echo "have  $img"; exit 0; fi
        if docker pull --platform linux/amd64 "$img" >"$log" 2>&1; then echo "ok    $img"; else echo "FAIL  $img (see $log)"; exit 1; fi
      ' _ {} || { echo "Some pulls failed." >&2; exit 1; }

      docker system df
  - path: /opt/retrace/run_trial.sh
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      # Run one trial of a step0 job: Droid on one SWE-bench Verified task inside its official image.
      #
      # Usage: /opt/retrace/run_trial.sh <job.json> <task_id> <trial>
      # Needs: FACTORY_API_KEY in the environment. Optional: DROID_TIMEOUT (seconds, default 1800),
      #        RETRACE_REPO (default /opt/retrace/repo).
      # Output: /opt/retrace/runs/<job_id>/<task_id>/<trial>/{prompt.md,start_commit,droid.json,droid.stderr,patch.diff,pred.json,meta.json,
      #         capture/,factory-sessions/,snapshots.bundle}
      # Writes the trace to $RETRACE_REPO/runs/traces/<job_id>-<task_id>-<trial>.json.
      set -euo pipefail

      [[ $# -eq 3 ]] || { sed -n '2,7p' "$0"; exit 1; }
      JOB="$(realpath "$1")"; IID="$2"; TRIAL="$3"
      : "${FACTORY_API_KEY:?Set FACTORY_API_KEY first (export FACTORY_API_KEY=fk-...)}"

      ROOT="${RETRACE_ROOT:-/opt/retrace}"
      REPO="${RETRACE_REPO:-$ROOT/repo}"
      PY="$ROOT/venv/bin/python"
      DATASET="${SWEBENCH_DATASET:-SWE-bench/SWE-bench_Verified}"

      JOB_ID="$(jq -r .job_id "$JOB")"
      MODEL="$(jq -r .model "$JOB")"
      ARM="$(jq -r .arm.kind "$JOB")"
      HINT="$(jq -r '.arm.text // ""' "$JOB")"
      CANDIDATE="$(jq -r '.arm.path // ""' "$JOB")"

      OUT="$ROOT/runs/$JOB_ID/$IID/$TRIAL"
      NAME="retrace-${JOB_ID}-${IID}-${TRIAL}"
      NAME="${NAME//[^A-Za-z0-9_.-]/-}"
      NAME="${NAME,,}"
      rm -rf "$OUT"; mkdir -p "$OUT"

      if [[ "$ARM" == candidate ]]; then
        [[ -d "$REPO/$CANDIDATE/.factory" || -f "$REPO/$CANDIDATE/AGENTS.md" ]] \
          || { echo "[$IID] candidate $CANDIDATE has no .factory/ or AGENTS.md under $REPO" >&2; exit 1; }
      fi

      # 1. Prompt: the problem statement, plus the hint for a hint arm. Never tests, patch, or dataset hints.
      IMAGE="$("$PY" - "$DATASET" "$IID" "$OUT/prompt.md" "$HINT" <<'PY'
      import sys
      from datasets import load_dataset
      name, iid, out, hint = sys.argv[1:5]
      row = next(r for r in load_dataset(name, split="test") if r["instance_id"] == iid)
      text = (
          "You are working in the git repository at /testbed (Python env: "
          "`source /opt/miniconda3/bin/activate testbed`).\n"
          "Resolve the issue below by editing the source code. Do not commit.\n\n"
          "<issue>\n" + row["problem_statement"] + "\n</issue>\n"
      )
      if hint:
          text += "\n<hint>\n" + hint + "\n</hint>\n"
      open(out, "w").write(text)
      print(row["image"])
      PY
      )"
      echo "[$IID#$TRIAL] image $IMAGE"

      # shellcheck disable=SC2329  # invoked via trap
      cleanup() { docker rm -f "$NAME" >/dev/null 2>&1 || true; }
      trap cleanup EXIT

      # 2. Start the task container with the host droid binary mounted read-only.
      docker run -d --name "$NAME" --platform linux/amd64 \
        -e FACTORY_API_KEY \
        -v /usr/local/bin/droid:/usr/local/bin/droid:ro \
        -v "$OUT:/retrace" \
        -v "$ROOT/capture:/opt/retrace-capture:ro" \
        -w /testbed "$IMAGE" sleep infinity >/dev/null

      # 3. Record HEAD to diff against. Candidate arm: overlay .factory/ and AGENTS.md. Keep both out of the patch.
      docker exec "$NAME" bash -c "printf '/.factory/\n/AGENTS.md\n' >> /testbed/.git/info/exclude"
      if [[ "$ARM" == candidate ]]; then
        [[ -d "$REPO/$CANDIDATE/.factory" ]] && docker cp "$REPO/$CANDIDATE/.factory" "$NAME:/testbed/.factory"
        [[ -f "$REPO/$CANDIDATE/AGENTS.md" ]] && docker cp "$REPO/$CANDIDATE/AGENTS.md" "$NAME:/testbed/AGENTS.md"
      fi
      docker exec -i "$NAME" bash -c 'mkdir -p /root/.factory && cat > /root/.factory/hooks.json' <<'JSON'
      {"PostToolUse": [{"matcher": "*", "hooks": [{"type": "command", "command": "/opt/retrace-capture/hook.sh"}]}]}
      JSON
      docker exec "$NAME" git -C /testbed rev-parse HEAD > "$OUT/start_commit"
      DROID_VERSION="$(docker exec "$NAME" droid --version | tail -n 1)"

      # 4. Headless Droid run. The container is disposable, so skip permission prompts.
      set +e
      timeout "${DROID_TIMEOUT:-1800}" docker exec -e FACTORY_API_KEY -e RETRACE_CAPTURE_DIR=/retrace/capture "$NAME" \
        droid exec --skip-permissions-unsafe --cwd /testbed -o json --model "$MODEL" -f /retrace/prompt.md \
        > "$OUT/droid.json" 2> "$OUT/droid.stderr"
      rc=$?
      set -e
      echo "[$IID#$TRIAL] droid exit $rc"

      # 5. Patch = everything changed since the container started, including new files.
      docker exec "$NAME" bash -c "cd /testbed && git add -A && git -c core.fileMode=false diff --cached $(<"$OUT/start_commit")" > "$OUT/patch.diff"
      echo "[$IID#$TRIAL] patch $(wc -l < "$OUT/patch.diff") lines"

      "$PY" - "$IID" "$JOB_ID-$ARM" "$OUT/patch.diff" "$OUT/pred.json" <<'PY'
      import json, sys
      iid, model, patch, out = sys.argv[1:5]
      json.dump({"instance_id": iid, "model_name_or_path": model, "model_patch": open(patch).read()}, open(out, "w"))
      PY

      # 6. Trace: keep the Droid session and the snapshot commits, then join them into runs/traces/.
      docker cp "$NAME:/root/.factory/sessions" "$OUT/factory-sessions" >/dev/null 2>&1 || true
      docker exec "$NAME" bash -c 'cd /testbed && refs=$(git for-each-ref --format="%(refname)" refs/retrace) && [ -n "$refs" ] && git bundle create /retrace/snapshots.bundle $refs ^$(cat /retrace/start_commit)' >/dev/null 2>&1 || true
      TRANSCRIPT="$(find "$OUT/factory-sessions" -name '*.jsonl' 2>/dev/null | head -n 1)"
      CAPTURE="$(find "$OUT/capture" -name '*.jsonl' 2>/dev/null | head -n 1)"
      if [[ -n "$TRANSCRIPT" && -n "$CAPTURE" ]]; then
        RETRACE_REPO="$REPO" "$PY" "$ROOT/capture/trace.py" --session-id "$JOB_ID-$IID-$TRIAL" --task-id "$IID" \
          --transcript "$TRANSCRIPT" --capture "$CAPTURE" || echo "[$IID#$TRIAL] trace failed" >&2
      else
        echo "[$IID#$TRIAL] no transcript or capture log, no trace" >&2
      fi

      # 7. Cost and metadata. A killed run prints no JSON, so its cost reads as 0.
      COST="$(jq -r '.usage.factory_credits // 0' "$OUT/droid.json" 2>/dev/null || true)"
      jq -n --arg v "$DROID_VERSION" --argjson cost "${COST:-0}" --argjson rc "$rc" \
        --arg sid "$(jq -r '.session_id // ""' "$OUT/droid.json" 2>/dev/null || true)" \
        '{droid_version: $v, cost_credits: $cost, droid_exit: $rc, droid_session_id: $sid}' > "$OUT/meta.json"
  - path: /opt/retrace/run_job.sh
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      # Run every task and rerun of a step0 job. Trials that already have a meta.json are skipped.
      #
      # Usage: /opt/retrace/run_job.sh <job.json> [parallel=8]
      # Stops starting trials once the credits spent reach budget_credits. Running trials finish, so up to
      # <parallel> trials can overshoot. Exits 3 when trials are left undone.
      # Then grade: /opt/retrace/grade.sh <job.json>
      set -euo pipefail

      [[ $# -ge 1 ]] || { sed -n '2,7p' "$0"; exit 1; }
      JOB="$(realpath "$1")"; PARALLEL="${2:-8}"
      ROOT="${RETRACE_ROOT:-/opt/retrace}"
      PY="$ROOT/venv/bin/python"

      "$PY" "$ROOT/retrace_job.py" validate "$JOB"
      JOB_ID="$(jq -r .job_id "$JOB")"
      BUDGET="$(jq .budget_credits "$JOB")"
      RUNS="$ROOT/runs/$JOB_ID"
      mkdir -p "$RUNS"

      spent() { find "$RUNS" -name meta.json -exec cat {} + | jq -s '[.[].cost_credits] | add // 0'; }
      pairs() {
        for ((t = 1; t <= $(jq .reruns "$JOB"); t++)); do
          for task in $(jq -r '.task_ids[]' "$JOB"); do
            [[ -f "$RUNS/$task/$t/meta.json" ]] || echo "$task $t"
          done
        done
      }

      worker() {
        if jq -en --argjson s "$(spent)" --argjson b "$BUDGET" '$s >= $b' >/dev/null; then
          echo "[$1#$2] skipped, budget reached"; return 0
        fi
        "$ROOT/run_trial.sh" "$JOB" "$1" "$2" || echo "[$1#$2] run_trial failed" >&2
      }
      export -f worker spent
      export JOB ROOT RUNS BUDGET

      pairs | xargs -r -P "$PARALLEL" -L1 bash -c 'worker "$@"' _

      left="$(pairs | wc -l)"
      echo "spent $(spent) of $BUDGET credits; $left trial(s) left"
      [[ "$left" -eq 0 ]] || exit 3
  - path: /opt/retrace/grade.sh
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      # Grade a step0 job with the official SWE-bench harness and write one result file per trial.
      #
      # Usage: /opt/retrace/grade.sh <job.json> [max_workers=8] [trial]
      # Results: $RETRACE_REPO/runs/results/<job_id>/<task_id>-step0-<arm>-<trial>.json
      # The harness takes one prediction per instance, so each trial is graded as its own evaluation run.
      set -euo pipefail

      [[ $# -ge 1 ]] || { sed -n '2,6p' "$0"; exit 1; }
      JOB="$(realpath "$1")"; WORKERS="${2:-8}"; ONLY="${3:-}"
      ROOT="${RETRACE_ROOT:-/opt/retrace}"
      PY="$ROOT/venv/bin/python"

      "$PY" "$ROOT/retrace_job.py" validate "$JOB"
      JOB_ID="$(jq -r .job_id "$JOB")"
      RUNS="$ROOT/runs/$JOB_ID"
      failed=0

      for ((t = 1; t <= $(jq .reruns "$JOB"); t++)); do
        [[ -z "$ONLY" || "$ONLY" == "$t" ]] || continue
        EVAL_DIR="$RUNS/eval-t$t"
        mkdir -p "$EVAL_DIR"
        PRED="$EVAL_DIR/predictions.jsonl"
        : > "$PRED"
        for task in $(jq -r '.task_ids[]' "$JOB"); do
          if [[ -f "$RUNS/$task/$t/meta.json" ]]; then cat "$RUNS/$task/$t/pred.json" >> "$PRED"; echo >> "$PRED"; fi
        done
        [[ -s "$PRED" ]] || { echo "trial $t: nothing to grade"; continue; }

        cd "$EVAL_DIR"   # swebench writes logs/run_evaluation/<eval_id>/ under cwd
        "$PY" -m swebench.harness.run_evaluation \
          --dataset_name "${SWEBENCH_DATASET:-SWE-bench/SWE-bench_Verified}" \
          --predictions_path "$PRED" \
          --max_workers "$WORKERS" \
          --run_id "t$t-$(date +%Y%m%d%H%M%S)" \
          --report_dir "$EVAL_DIR"
        "$PY" "$ROOT/retrace_job.py" collect "$JOB" "$t" || failed=1
      done
      [[ "$failed" -eq 0 ]] || { echo "some trials could not be collected, see above" >&2; exit 1; }
  - path: /opt/retrace/retrace_job.py
    permissions: '0755'
    content: |
      #!/usr/bin/env python3
      """Contract helpers for step0 jobs.

        retrace_job.py validate <job.json>
        retrace_job.py collect <job.json> <trial>
      """
      import json
      import os
      import sys
      from pathlib import Path

      from jsonschema import Draft202012Validator

      ROOT = Path(os.environ.get("RETRACE_ROOT", "/opt/retrace"))
      REPO = Path(os.environ.get("RETRACE_REPO", ROOT / "repo"))


      def schema(name):
          return json.loads((REPO / "contracts" / f"{name}.schema.json").read_text())


      def check(instance, name):
          errors = sorted(Draft202012Validator(schema(name)).iter_errors(instance), key=str)
          if errors:
              sys.exit(f"{name}: " + "; ".join(e.message for e in errors))


      def load_job(path):
          job = json.loads(Path(path).read_text())
          check(job, "replay-job")
          if job["start"] != "step0":
              sys.exit("run_job handles step0 jobs only")
          if job["stop_mode"] != "next_user_turn":
              sys.exit("droid exec ends at the agent's final reply, so only stop_mode next_user_turn is supported")
          return job


      def model_name(job):
          return f"{job['job_id']}-{job['arm']['kind']}"


      def collect(job_path, trial):
          job = load_job(job_path)
          job_id, kind = job["job_id"], job["arm"]["kind"]
          eval_dir = ROOT / "runs" / job_id / f"eval-t{trial}"
          out_dir = REPO / "runs" / "results" / job_id
          out_dir.mkdir(parents=True, exist_ok=True)
          ungraded = []
          for task in job["task_ids"]:
              art = ROOT / "runs" / job_id / task / str(trial)
              meta_file = art / "meta.json"
              if not meta_file.exists():
                  continue
              meta = json.loads(meta_file.read_text())
              reports = sorted(eval_dir.glob(f"logs/run_evaluation/*/{model_name(job)}/{task}/report.json"))
              if reports:
                  passed = bool(json.loads(reports[-1].read_text())[task]["resolved"])
              elif not (art / "patch.diff").read_text().strip():
                  passed = False
              else:
                  ungraded.append(task)
                  continue
              result = {
                  "job_id": job_id,
                  "task_id": task,
                  "arm": kind,
                  "model": job["model"],
                  "droid_version": meta["droid_version"],
                  "stop_mode": job["stop_mode"],
                  "trial": trial,
                  "passed": passed,
                  "grader": "swebench",
                  "evidence_role": "final",
                  "cost_credits": meta["cost_credits"],
              }
              session_id = f"{job_id}-{task}-{trial}"
              if (REPO / "runs" / "traces" / f"{session_id}.json").exists():
                  result["session_id"] = session_id
              check(result, "replay-result")
              (out_dir / f"{task}-step0-{kind}-{trial}.json").write_text(json.dumps(result, indent=2) + "\n")
              print(f"{task} trial {trial}: {'pass' if passed else 'fail'}")
          if ungraded:
              sys.exit(f"no grader report for: {', '.join(ungraded)}")


      def main():
          if len(sys.argv) >= 3 and sys.argv[1] == "validate":
              load_job(sys.argv[2])
          elif len(sys.argv) == 4 and sys.argv[1] == "collect":
              collect(sys.argv[2], int(sys.argv[3]))
          else:
              sys.exit(__doc__)


      main()
  - path: /opt/retrace/capture/snapshot.sh
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      # Usage: snapshot.sh [repo-dir]
      # Prints a commit id for the whole working tree, untracked files included.
      set -euo pipefail

      cd "${1:-.}"
      git_dir=$(git rev-parse --absolute-git-dir)
      index=$(mktemp "$git_dir/retrace-index.XXXXXX")
      trap 'rm -f "$index"' EXIT

      if [[ -f $git_dir/index ]]; then
        cp "$git_dir/index" "$index"
      else
        rm -f "$index"
      fi

      GIT_INDEX_FILE=$index git add -A
      tree=$(GIT_INDEX_FILE=$index git write-tree)

      parent=()
      if head=$(git rev-parse --verify -q HEAD); then
        parent=(-p "$head")
      fi

      commit=$(git -c user.name=retrace -c user.email=retrace@localhost \
        commit-tree "$tree" "${parent[@]}" -m "retrace snapshot")
      git update-ref "refs/retrace/$commit" "$commit"
      echo "$commit"
  - path: /opt/retrace/capture/hook.sh
    permissions: '0755'
    content: |
      #!/bin/sh
      exec "$(command -v python3 || echo /opt/miniconda3/bin/python3)" "$(dirname "$0")/hook.py"
  - path: /opt/retrace/capture/hook.py
    permissions: '0755'
    content: |
      #!/usr/bin/env python3
      """Droid PostToolUse hook: snapshot the working tree, log one line per tool call.

      Appends to $RETRACE_CAPTURE_DIR/<session_id>.jsonl (default ~/.retrace/capture). Stdlib only, because
      SWE-bench images ship no jq.
      """
      import fcntl
      import json
      import os
      import subprocess
      import sys
      from pathlib import Path

      event = json.load(sys.stdin)
      snapshot = Path(__file__).with_name("snapshot.sh")
      ref = subprocess.run([snapshot, event["cwd"]], capture_output=True, text=True, check=True).stdout.strip()

      log_dir = Path(os.environ.get("RETRACE_CAPTURE_DIR", Path.home() / ".retrace" / "capture"))
      log_dir.mkdir(parents=True, exist_ok=True)
      line = json.dumps({
          "session_id": event["session_id"],
          "tool_name": event["tool_name"],
          "tool_input": event["tool_input"],
          "snapshot_ref": ref,
      }) + "\n"
      with open(log_dir / f"{event['session_id']}.jsonl", "a") as f:
          fcntl.flock(f, fcntl.LOCK_EX)
          f.write(line)
  - path: /opt/retrace/capture/trace.py
    permissions: '0755'
    content: |
      #!/usr/bin/env python3
      """Write runs/traces/<session-id>.json from a Droid transcript and a hook.py capture log.

        trace.py --session-id ID --task-id TASK --transcript T.jsonl --capture C.jsonl [--out DIR]

      Each tool_use in the transcript becomes a step. Its snapshot_ref comes from the capture line with the
      same tool_name and tool_input, taken in order. Droid runs no PostToolUse hook for a failed tool call, so
      such a call takes the previous step's snapshot_ref. A failed call before any snapshot is dropped.
      """
      import argparse
      import json
      import os
      import sys
      from collections import defaultdict, deque
      from pathlib import Path

      from jsonschema import Draft202012Validator

      REPO = Path(os.environ.get("RETRACE_REPO", Path(__file__).resolve().parents[2]))


      def key(name, tool_input):
          return name, json.dumps(tool_input, sort_keys=True)


      def main():
          ap = argparse.ArgumentParser()
          ap.add_argument("--session-id", required=True)
          ap.add_argument("--task-id", required=True)
          ap.add_argument("--transcript", required=True)
          ap.add_argument("--capture", required=True)
          ap.add_argument("--out", default=REPO / "runs" / "traces")
          args = ap.parse_args()

          refs = defaultdict(deque)
          for line in Path(args.capture).read_text().splitlines():
              row = json.loads(line)
              refs[key(row["tool_name"], row["tool_input"])].append(row["snapshot_ref"])

          harness_session_id, steps, inherited, dropped, last_ref = None, [], 0, 0, None
          for line in Path(args.transcript).read_text().splitlines():
              row = json.loads(line)
              if row.get("type") == "session_start":
                  harness_session_id = row["id"]
              message = row.get("message") or {}
              if row.get("type") != "message" or message.get("role") != "assistant":
                  continue
              for block in message["content"]:
                  if block.get("type") != "tool_use":
                      continue
                  queue = refs[key(block["name"], block["input"])]
                  if queue:
                      last_ref = queue.popleft()
                  elif last_ref:
                      inherited += 1
                  else:
                      dropped += 1
                      continue
                  steps.append({
                      "tool_call_id": block["id"],
                      "message_id": row["id"],
                      "tool_name": block["name"],
                      "snapshot_ref": last_ref,
                  })

          trace = {
              "session_id": args.session_id,
              "harness": "droid",
              "task_id": args.task_id,
              "harness_session_id": harness_session_id,
              "steps": steps,
          }
          schema = json.loads((REPO / "contracts" / "trace.schema.json").read_text())
          errors = sorted(Draft202012Validator(schema).iter_errors(trace), key=str)
          if errors:
              sys.exit("trace.schema.json: " + "; ".join(e.message for e in errors))
          out = Path(args.out)
          out.mkdir(parents=True, exist_ok=True)
          (out / f"{args.session_id}.json").write_text(json.dumps(trace, indent=2) + "\n")
          print(f"{args.session_id}: {len(steps)} steps, {inherited} with the previous snapshot, {dropped} dropped")


      main()

runcmd:
  - [sysctl, --system]
  - [bash, -c, "curl -fsSL https://get.docker.com | sh"]
  - [systemctl, enable, --now, docker]
  - [bash, -c, "usermod -aG docker retrace; for u in ubuntu linuxuser; do id $u >/dev/null 2>&1 && usermod -aG docker $u; done; true"]
  - [bash, -c, "mkdir -p /home/retrace/.ssh && cp /root/.ssh/authorized_keys /home/retrace/.ssh/ 2>/dev/null; chown -R retrace:retrace /home/retrace/.ssh; chmod 700 /home/retrace/.ssh; true"]
  - [bash, -c, "curl -fsSL https://deb.nodesource.com/setup_lts.x | bash - && apt-get install -y nodejs"]
  - [bash, -c, "export HOME=/root && curl -fsSL https://app.factory.ai/cli | sh && install -m 0755 /root/.local/bin/droid /usr/local/bin/droid"]
  - [bash, -c, "python3 -m venv /opt/retrace/venv && /opt/retrace/venv/bin/pip install --upgrade pip && /opt/retrace/venv/bin/pip install 'swebench==5.0.2' datasets jsonschema"]
  - [bash, -c, "git clone https://github.com/andrewy1n/retrace.git /opt/retrace/repo"]
  - [bash, -c, "git config --system --add safe.directory /opt/retrace/repo"]
  - [bash, -c, "mkdir -p /opt/retrace/runs /opt/retrace/logs && chown -R retrace:retrace /opt/retrace"]
  - [bash, -c, "docker --version; node --version; droid --version; /opt/retrace/venv/bin/python -c 'import swebench; print(\"swebench\", swebench.__version__)'"]
  - [bash, -c, "date -Is > /opt/retrace/READY"]

final_message: "Retrace worker ready after $UPTIME s. See /var/log/cloud-init-output.log"
