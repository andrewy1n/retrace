appearance:
  default: light
  switcher: false

theme:
  colorPalettes:
    default:
      light: ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]
      dark: ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"]
  colorScales:
    default:
      light: ["#f4f4f5", "#27272a"]
      dark: ["#27272a", "#e4e4e7"]
  colors:
    primary:
      light: "#27272a"
      dark: "#e4e4e7"
    accent:
      light: "#27272a"
      dark: "#e4e4e7"
    base:
      light: "#ffffff"
      dark: "#09090b"
    info:
      light: "#52525b"
      dark: "#a1a1aa"
    positive:
      light: "#15803d"
      dark: "#4ade80"
    warning:
      light: "#a16207"
      dark: "#fbbf24"
    negative:
      light: "#b91c1c"
      dark: "#f87171"

plugins:
  components:
    "@evidence-dev/core-components": {}
  datasources:
    "@evidence-dev/postgres": {}
    "@evidence-dev/csv": {}
